name: Terraform (fiap-mecanica-db)

on:
  pull_request:
    branches: ["homolog", "main"]
    paths:
      - "**.tf"
      - "modules/**"
  push:
    branches: ["homolog", "main"]
    paths:
      - "**.tf"
      - "modules/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: terraform-database-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan-homolog:
    name: Plan Homolog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'homolog'
    environment: homolog
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica-db' }}
      TF_VAR_environment: homolog
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS }}
      TF_VAR_app_security_group: ${{ vars.APP_SECURITY_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color

  plan-production:
    name: Plan Production
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica-db' }}
      TF_VAR_environment: production
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS }}
      TF_VAR_app_security_group: ${{ vars.APP_SECURITY_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color

  apply-homolog:
    name: Apply Homolog
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/homolog'
    environment: homolog
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica-db' }}
      TF_VAR_environment: homolog
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS }}
      TF_VAR_app_security_group: ${{ vars.APP_SECURITY_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Export DATABASE_URL to GitHub Actions secret
        run: |
          DATABASE_URL=$(terraform output -raw database_url)
          gh secret set DATABASE_URL --body "$DATABASE_URL" --repo Nuri-an/fiap-mecanica-k8s
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  apply-production:
    name: Apply Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica-db' }}
      TF_VAR_environment: production
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS }}
      TF_VAR_app_security_group: ${{ vars.APP_SECURITY_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Export DATABASE_URL to GitHub Actions secret
        run: |
          DATABASE_URL=$(terraform output -raw database_url)
          gh secret set DATABASE_URL --body "$DATABASE_URL" --repo Nuri-an/fiap-mecanica-k8s
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
